controller_manager:
  ros__parameters:
    update_rate: 50

    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diffdrive_controller:
  ros__parameters:
    left_wheel_names: ["left wheel motor"]
    right_wheel_names: ["right wheel motor"]

    wheel_separation: 0.16
    wheel_radius: 0.033
    wheel_separation_multiplier: 1.112

    use_stamped_vel: false

    base_frame_id: "base_link"
    odom_frame_id: "odom"

    publish_rate: 50.0
    open_loop: false
    enable_odom_tf: false

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Velocity limits — enforced to stay within Webots motor maxVelocity (6.67 rad/s)
    # max linear  = wheel_radius * max_motor_vel = 0.033 * 6.67 = 0.22 m/s
    # max angular = 2 * wheel_radius * max_motor_vel / wheel_sep = 2.75 rad/s
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.22
        min_velocity: -0.22
        has_acceleration_limits: true
        max_acceleration: 0.5
        min_acceleration: -0.5
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 2.75
        min_velocity: -2.75
        has_acceleration_limits: true
        max_acceleration: 1.0
        min_acceleration: -1.0

joint_state_broadcaster:
  ros__parameters:
    extra_joints:
      - LDS-01_secondary_motor
      - LDS-01_main_motor
